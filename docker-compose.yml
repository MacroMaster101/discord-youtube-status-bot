services:
  bot:
    build: .
    container_name: discord-youtube-status-bot
    restart: unless-stopped
    ports:
      # The dashboard is plain HTTP, so this defaults to loopback and has to be
      # opened deliberately. Docker inserts its own iptables chain ahead of ufw,
      # so a host firewall does not close a port published to every interface --
      # only a cloud security group would, which is easy to assume is in place
      # and not be. Reach it through the Cloudflare Tunnel below, or an SSH
      # tunnel; set DASHBOARD_BIND_ADDRESS=0.0.0.0 only to expose it on purpose.
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    # This bot shares its host with a sibling Discord bot on 1 GB of RAM. With
    # no cap, a memory spike here does not get this container killed -- the
    # kernel OOM killer scores every process and may pick cloudflared, the other
    # bot, or sshd instead, so the thing that misbehaved keeps running and
    # something unrelated dies. Idle use is around 60 MiB.
    mem_limit: 256m

  # Optional HTTPS access through Cloudflare Tunnel. Enable it by adding to .env:
  #   COMPOSE_PROFILES=tunnel
  #   TUNNEL_TOKEN=<token from Cloudflare Zero Trust → Networks → Tunnels>
  # and point the tunnel's public hostname at http://bot:8080
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    container_name: cloudflared-youtube-status-bot
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    mem_limit: 128m
    depends_on:
      - bot
