<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Discord YouTube Status Bot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B4E"/>
      <stop offset="1" stop-color="#C4001A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Play-button body -->
  <rect x="40" y="96" width="432" height="320" rx="96" fill="url(#bg)"/>
  <rect x="40" y="96" width="432" height="160" rx="96" fill="url(#shine)"/>

  <!-- Play triangle -->
  <path d="M212 186 L332 256 L212 326 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>

  <!-- Discord-style online status dot -->
  <circle cx="420" cy="388" r="64" fill="#5865F2"/>
  <circle cx="420" cy="388" r="40" fill="#23A55A"/>
</svg>
